name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: 核心库与命令行版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 系统依赖（hidapi 在 Linux 上要 libudev）
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
      - name: 格式检查
        run: cargo fmt --all --check --manifest-path tool/Cargo.toml
      - name: Clippy
        # 只查 core 与 cli：Tauri 那层要 glib/webkit2gtk（Linux 系统依赖），
        # 桌面应用的编译由 release 流水线在 Windows 上验证。
        run: cargo clippy -p y65s-core -p y65s-cli --all-targets --manifest-path tool/Cargo.toml -- -D warnings
      - name: 测试
        run: cargo test -p y65s-core -p y65s-cli --manifest-path tool/Cargo.toml

  webui:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm --prefix tool/webui ci
      - name: 类型检查与构建
        run: npm --prefix tool/webui run build
